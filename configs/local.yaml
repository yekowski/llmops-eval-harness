# Local Model Runtime Configuration for Offline Evaluation
dataset_path: "data/adversarial_eval.json"

sla_thresholds:
  min_faithfulness: 0.85
  min_relevance: 0.80
  min_correctness: 0.85
  min_context_precision: 0.75
  min_context_recall: 0.75
  min_pass_rate: 0.90
  max_latency_ms: 15000
  max_cost_usd: 0.05
  max_score_drop: 0.03

# System Under Test (SUT) Provider Configuration
sut:
  fallback_chain:
    - "ollama"
    - "mock"
  providers:
    ollama:
      base_url: "http://localhost:11434/v1"
      model: "llama3.2:3b"
      temperature: 0.0

# LLM Judge Provider Configuration (Decoupled from SUT)
judge:
  fallback_chain:
    - "gemini"
  providers:
    gemini:
      model: "gemini-3.5-flash"

