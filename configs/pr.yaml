# SLA Threshold Configuration for PR Validation
dataset_path: "data/adversarial_eval.json"

sla_thresholds:
  min_faithfulness: 0.85
  min_relevance: 0.80
  min_correctness: 0.85
  min_pass_rate: 0.90
  max_latency_ms: 3000
  max_cost_usd: 0.05
  max_score_drop: 0.03

fallback_chain:
  - "groq"
  - "gemini"
  - "mock"

providers:
  groq:
    model: "llama-3.3-70b-versatile"
    temperature: 0.0
