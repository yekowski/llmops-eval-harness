# SLA Threshold Configuration for PR Validation
dataset_path: "data/adversarial_eval.json"

# Strict CI Safety: Fail if judge calls fail or fall back to heuristic grading
judge_failure_policy: "fail"

concurrency:
  max_workers: 5
  requests_per_second: 1.0

sla_thresholds:
  min_faithfulness: 0.85
  min_relevance: 0.80
  min_correctness: 0.85
  min_context_precision: 0.75
  min_context_recall: 0.75
  min_pass_rate: 0.90
  max_latency_ms: 3000
  max_cost_usd: 0.05
  max_score_drop: 0.03

# System Under Test (SUT) Provider Configuration
sut:
  fallback_chain:
    - "groq"
    - "gemini"
    - "mock"
  providers:
    groq:
      model: "llama-3.3-70b-versatile"
      temperature: 0.0

# LLM Judge Provider Configuration (Decoupled from SUT)
judge:
  fallback_chain:
    - "gemini"
  providers:
    gemini:
      model: "gemini-3.5-flash"
