[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmops-eval-harness"
version = "0.1.0"
description = "Lightweight, deterministic CI/CD evaluation harness for LLM/RAG pipelines"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LLMOps Team" }
]
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
llmops-eval = "run_eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "configs*", "datasets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
